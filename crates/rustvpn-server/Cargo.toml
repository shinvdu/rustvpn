[package]
name = "rustvpn-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "rustvpn-server"
path = "src/main.rs"

[features]
default = []

[dependencies]
rustvpn-crypto = { path = "../rustvpn-crypto" }
rustvpn-proto = { path = "../rustvpn-proto" }
rustvpn-net = { path = "../rustvpn-net" }
rustvpn-control = { path = "../rustvpn-control" }
tokio = { workspace = true }
tokio-util = { workspace = true }
anyhow = { workspace = true }
rand_core = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
tempfile = "3"