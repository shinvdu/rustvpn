[package]
name = "rustvpn-windows-shim-spike"
version = "0.1.0-alpha.0"
edition = "2021"
# wintun-bindings 0.7.40 uses `let ... && ...` chains (Rust 1.88).
rust-version = "1.88"
license = "GPL-3.0-or-later"
description = "Phase 0 Ethernet shim + Wintun adapter prototype for the RustVPN Windows client"
publish = false

# Standalone on purpose: this prototype must not join the RustVPN workspace.
[workspace]

[lib]
name = "rustvpn_windows_shim"
path = "src/lib.rs"

[[bin]]
name = "windows-shim-spike"
path = "src/main.rs"

[dependencies]
# SHA-256 pinning of wintun.dll. Platform-independent so the helper and its
# tests also run on Linux.
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
# Kept target-local so Linux `cargo test` never builds the Wintun bindings.
wintun-bindings = "0.7.40"

[target.'cfg(unix)'.dev-dependencies]
# Golden test only: the prototype stays standalone, but its wire-MTU
# arithmetic is checked against the real `rustvpn-proto` constants.
#
# Target-scoped because `rustvpn-crypto` (a proto dependency) currently uses
# `std::os::unix`; on Windows the golden test is skipped and the prototype
# still builds/tests standalone.
rustvpn-proto = { path = "../../crates/rustvpn-proto" }

[profile.release]
debug = false