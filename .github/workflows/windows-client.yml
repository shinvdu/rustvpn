name: Windows client

# Isolated Windows client build: unit tests, clippy, release binaries and the
# unsigned MSI.  This workflow does not install the MSI, register the service,
# or use signing secrets.  The Wintun smoke test stays a manual, elevated
# check.  prototypes/windows-shim has its own workflow.
on:
  push:
    paths:
      - "crates/**"
      - "packaging/windows/**"
      - "docs/windows-install.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/windows-client.yml"
  pull_request:
    paths:
      - "crates/**"
      - "packaging/windows/**"
      - "docs/windows-install.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/windows-client.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-client:
    name: test and package (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Show toolchain
        run: |
          rustc -V
          cargo -V

      - name: Install WiX Toolset 3.14
        shell: pwsh
        run: |
          $candle = Get-Command candle.exe -ErrorAction SilentlyContinue
          if (-not $candle) {
            try {
              choco install wixtoolset --version=3.14.1 -y --no-progress
            } catch {
              Write-Host "chocolatey install failed: $_"
            }
            $candle = Get-Command candle.exe -ErrorAction SilentlyContinue
          }
          if (-not $candle) {
            $zip = Join-Path $env:RUNNER_TEMP 'wix314.zip'
            $dir = Join-Path $env:RUNNER_TEMP 'wix314'
            Invoke-WebRequest -Uri 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip' -OutFile $zip
            $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne '6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31') {
              throw "WiX binaries SHA-256 mismatch: $hash"
            }
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            $candle = Get-ChildItem $dir -Recurse -Filter candle.exe | Select-Object -First 1
            if (-not $candle) { throw 'candle.exe not found in the WiX zip' }
            Add-Content -Path $env:GITHUB_PATH -Value (Split-Path -Parent $candle.FullName)
          }
          Get-Command candle.exe, light.exe | Format-Table Name, Source -AutoSize

      - name: Download and verify Wintun 0.14.1
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'wintun-0.14.1.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'wintun-0.14.1'
          Invoke-WebRequest -Uri 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $dll = Get-ChildItem $dir -Recurse -Filter wintun.dll |
            Where-Object { $_.FullName -match '\\amd64\\' } |
            Select-Object -First 1
          if (-not $dll) { throw 'amd64/wintun.dll not found in the Wintun zip' }
          $hash = (Get-FileHash -LiteralPath $dll.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'e5da8447dc2c320edc0fc52fa01885c103de8c118481f683643cacc3220dafce') {
            throw "Wintun SHA-256 mismatch: $hash"
          }
          $stage = Join-Path $env:RUNNER_TEMP 'wintun-stage'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -LiteralPath $dll.FullName -Destination (Join-Path $stage 'wintun.dll')
          "WINTUN_DIR=$stage" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check Windows client crates
        run: >
          cargo check --locked --target x86_64-pc-windows-msvc
          -p rustvpn-client-ipc -p rustvpn-clientd -p rustvpn-client-core
          -p rustvpn-net -p rustvpn-client-gui

      - name: Clippy Windows client crates
        run: >
          cargo clippy --locked --target x86_64-pc-windows-msvc --all-targets
          -p rustvpn-client-ipc -p rustvpn-clientd -p rustvpn-client-core
          -p rustvpn-net -p rustvpn-client-gui -- -D warnings

      - name: Test Windows client crates
        run: >
          cargo test --locked --target x86_64-pc-windows-msvc
          -p rustvpn-client-ipc -p rustvpn-clientd -p rustvpn-client-core
          -p rustvpn-net -p rustvpn-client-gui

      - name: Build MSI (unsigned)
        shell: pwsh
        run: |
          & packaging\windows\build-msi.ps1 `
            -WintunDir $env:WINTUN_DIR `
            -OutputDir (Join-Path $PWD 'dist\windows')

      - name: Inspect MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem -LiteralPath 'dist\windows' -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw 'no MSI was produced' }
          $versionLine = Get-Content -LiteralPath 'dist\windows\BUILD-INFO.txt' |
            Where-Object { $_ -match '^MSI ProductVersion: ' } |
            Select-Object -First 1
          $msiVersion = ($versionLine -split ':', 2)[1].Trim()
          & packaging\windows\verify-msi.ps1 `
            -MsiPath $msi.FullName `
            -ExpectedMsiVersion $msiVersion

      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rustvpn-windows-unsigned
          path: |
            dist/windows/*.msi
            dist/windows/BUILD-INFO.txt
            dist/windows/SHA256SUMS.txt
            dist/windows/UNSIGNED.txt
          if-no-files-found: error