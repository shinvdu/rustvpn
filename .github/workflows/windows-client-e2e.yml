name: Windows client E2E (manual)

# Manual, privileged acceptance run: connects the installed Windows client to
# a real (external) rustvpn-server.  It is deliberately NOT triggered by push
# or pull_request and runs only on a self-hosted, elevated Windows runner.
#
# Required repository/environment secrets (environment `windows-client-e2e`):
#   RUSTVPN_E2E_VERIFIER  client short verifier matching the server peers.yaml
#   RUSTVPN_E2E_PASSWORD  passphrase for that verifier (never written to logs)
#
# The external Linux server is provisioned by the operator; this workflow only
# builds/installs the MSI on Windows, drives the client, and uninstalls it.
# The connect step is split-tunnel by default; full-tunnel/default routes are
# refused unless the `full_tunnel` input is explicitly enabled.
on:
  workflow_dispatch:
    inputs:
      server:
        description: "rustvpn-server endpoint, host:port"
        required: true
        type: string
      address:
        description: "Windows tunnel address CIDR (for example 10.88.0.2/24)"
        required: true
        type: string
      gateway:
        description: "Tunnel gateway (for example 10.88.0.1)"
        required: true
        type: string
      routes:
        description: "Comma-separated split routes (no default route)"
        required: true
        type: string
      ping_targets:
        description: "Comma-separated ping targets inside the tunnel"
        required: false
        type: string
      tcp_target:
        description: "Optional TCP target for a banner/payload check"
        required: false
        type: string
      tcp_port:
        description: "TCP port for the optional banner check"
        required: false
        default: "22"
        type: string
      iface:
        description: "Wintun adapter name"
        required: false
        default: "rsvpn-e2e"
        type: string
      full_tunnel:
        description: "Allow a default route (can cut RDP/SSH; use only in a disposable environment)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-client-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-e2e:
    name: connect, verify, cleanup
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, windows, x64, rustvpn-e2e]
    environment: windows-client-e2e
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Preconditions (elevated runner, WiX, baseline default route)
        shell: pwsh
        run: |
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = New-Object Security.Principal.WindowsPrincipal($identity)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw "the self-hosted runner must be elevated to install the MSI and create Wintun adapters"
          }
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            throw "WiX 3.14 (candle.exe/light.exe) is required on the runner"
          }
          Get-NetRoute -AddressFamily IPv4 -DestinationPrefix 0.0.0.0/0 |
            Select-Object DestinationPrefix, InterfaceIndex, NextHop, RouteMetric |
            ConvertTo-Json -Compress |
            Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'default-routes-before.json')

      - name: Download and pin Wintun 0.14.1
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'wintun-0.14.1.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'wintun-0.14.1'
          Invoke-WebRequest -Uri 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $dll = Get-ChildItem $dir -Recurse -Filter wintun.dll |
            Where-Object { $_.FullName -match '\\amd64\\' } |
            Select-Object -First 1
          if (-not $dll) { throw 'amd64/wintun.dll not found in the Wintun zip' }
          $hash = (Get-FileHash -LiteralPath $dll.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'e5da8447dc2c320edc0fc52fa01885c103de8c118481f683643cacc3220dafce') {
            throw "Wintun SHA-256 mismatch: $hash"
          }
          $stage = Join-Path $env:RUNNER_TEMP 'wintun-stage'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -LiteralPath $dll.FullName -Destination (Join-Path $stage 'wintun.dll')
          "WINTUN_DIR=$stage" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build and install the unsigned MSI
        shell: pwsh
        run: |
          & packaging\windows\build-msi.ps1 `
            -WintunDir $env:WINTUN_DIR -OutputDir (Join-Path $PWD 'dist\windows')
          $msi = Get-ChildItem -LiteralPath 'dist\windows' -Filter *.msi |
            Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $msi) { throw 'no MSI was produced' }
          # Export before install so the always() cleanup can uninstall even if
          # service registration or the start step fails.
          "MSI_PATH=$($msi.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $log = Join-Path $env:RUNNER_TEMP 'rustvpn-e2e-install.log'
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            '/i', "`"$($msi.FullName)`"", '/qn', '/l*v', "`"$log`"",
            "`"RUSTVPN_USER=$env:USERDOMAIN\$env:USERNAME`"")
          if ($p.ExitCode -ne 0) { throw "MSI install failed: $($p.ExitCode) (log: $log)" }
          Get-Service rustvpn-clientd | Format-List Name, Status

      - name: Write the ephemeral passphrase file (restricted ACL)
        shell: pwsh
        env:
          RUSTVPN_E2E_PASSWORD: ${{ secrets.RUSTVPN_E2E_PASSWORD }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'rustvpn-e2e-pass.txt'
          Set-Content -LiteralPath $path -Value $env:RUSTVPN_E2E_PASSWORD `
            -NoNewline -Encoding ascii
          icacls $path /inheritance:r /grant:r "*S-1-5-18:(R)" "*S-1-5-32-544:(R)" | Out-Null
          "RUSTVPN_E2E_PASS_FILE=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Connect and verify (split tunnel)
        shell: pwsh
        env:
          RUSTVPN_E2E_VERIFIER: ${{ secrets.RUSTVPN_E2E_VERIFIER }}
          INPUT_SERVER: ${{ inputs.server }}
          INPUT_ADDRESS: ${{ inputs.address }}
          INPUT_GATEWAY: ${{ inputs.gateway }}
          INPUT_ROUTES: ${{ inputs.routes }}
          INPUT_PING_TARGETS: ${{ inputs.ping_targets }}
          INPUT_TCP_TARGET: ${{ inputs.tcp_target }}
          INPUT_TCP_PORT: ${{ inputs.tcp_port }}
          INPUT_IFACE: ${{ inputs.iface }}
          INPUT_FULL_TUNNEL: ${{ inputs.full_tunnel }}
        run: |
          # Never interpolate workflow_dispatch inputs into script text.  A
          # quote in an input would otherwise execute arbitrary PowerShell on
          # this elevated, secret-bearing self-hosted runner.
          $routes = @($env:INPUT_ROUTES -split ',' |
            ForEach-Object { $_.Trim() } | Where-Object { $_ })
          $pings = @($env:INPUT_PING_TARGETS -split ',' |
            ForEach-Object { $_.Trim() } | Where-Object { $_ })
          $server = $env:INPUT_SERVER
          $params = @{
            Phase = 'connect'
            Remote = $server
            ShortVerifier = $env:RUSTVPN_E2E_VERIFIER
            PasswordFile = $env:RUSTVPN_E2E_PASS_FILE
            Iface = $env:INPUT_IFACE
            Address = $env:INPUT_ADDRESS
            Gateway = $env:INPUT_GATEWAY
            Routes = $routes
            PingTargets = $pings
            OuterEndpoint = $server.Substring(0, $server.LastIndexOf(':'))
          }
          if ($env:INPUT_TCP_TARGET) {
            $params.TcpTarget = $env:INPUT_TCP_TARGET
            $params.TcpPort = [int]$env:INPUT_TCP_PORT
          }
          if ($env:INPUT_FULL_TUNNEL -eq 'true') {
            $params.AllowFullTunnel = $true
          }
          & packaging/windows/e2e-tunnel.ps1 @params |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'e2e-connect.json')

      - name: Disconnect (always)
        if: always()
        shell: pwsh
        env:
          INPUT_IFACE: ${{ inputs.iface }}
        run: |
          if (Test-Path -LiteralPath 'packaging\windows\e2e-tunnel.ps1') {
            & powershell -NoProfile -ExecutionPolicy Bypass `
              -File 'packaging\windows\e2e-tunnel.ps1' -Phase disconnect `
              -Iface $env:INPUT_IFACE -WaitSeconds 60
          }

      - name: Compare the default route and show state (always)
        if: always()
        shell: pwsh
        run: |
          Get-NetRoute -AddressFamily IPv4 -DestinationPrefix 0.0.0.0/0 |
            Select-Object DestinationPrefix, InterfaceIndex, NextHop, RouteMetric |
            ConvertTo-Json -Compress
          $before = Get-Content (Join-Path $env:RUNNER_TEMP 'default-routes-before.json') -Raw
          $after = Get-NetRoute -AddressFamily IPv4 -DestinationPrefix 0.0.0.0/0 |
            Select-Object DestinationPrefix, InterfaceIndex, NextHop, RouteMetric |
            ConvertTo-Json -Compress
          Write-Host "default route before: $before"
          Write-Host "default route after:  $after"
          if (Test-Path -LiteralPath 'C:\ProgramData\RustVPN\netstate.json') {
            Write-Warning 'netstate.json still exists; inspect crash recovery before uninstalling'
          }

      - name: Remove credentials and uninstall the MSI (always)
        if: always()
        shell: pwsh
        run: |
          if ($env:RUSTVPN_E2E_PASS_FILE -and (Test-Path -LiteralPath $env:RUSTVPN_E2E_PASS_FILE)) {
            Remove-Item -LiteralPath $env:RUSTVPN_E2E_PASS_FILE -Force
          }
          if (-not $env:MSI_PATH) {
            $found = Get-ChildItem -LiteralPath 'dist\windows' -Filter *.msi -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime | Select-Object -Last 1
            if ($found) { $env:MSI_PATH = $found.FullName }
          }
          if ($env:MSI_PATH -and (Test-Path -LiteralPath $env:MSI_PATH)) {
            $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
              '/x', "`"$env:MSI_PATH`"", '/qn')
            if ($p.ExitCode -ne 0) { Write-Warning "MSI uninstall exited $($p.ExitCode)" }
          }
          Get-Service rustvpn-clientd -ErrorAction SilentlyContinue |
            Format-List Name, Status