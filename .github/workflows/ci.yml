name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libsoup-3.0-dev libdbus-1-dev

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check UI JavaScript
        run: |
          node --check crates/rustvpn-client-gui/ui/app.js
          node --check crates/rustvpn-client-gui/ui/tauri-bridge.js

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Release build
        run: cargo build --release --workspace

      - name: Admin daemon build
        run: cargo build --release -p rustvpn-admin --bins