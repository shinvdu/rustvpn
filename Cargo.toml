[workspace]
resolver = "2"
members = [
    "crates/rustvpn-crypto",
    "crates/rustvpn-proto",
    "crates/rustvpn-verifier",
    "crates/rustvpn-net",
    "crates/rustvpn-server",
    "crates/rustvpn-client",
    "crates/rustvpn-control",
    "crates/rustvpn-admin",
]
# `cargo build` at the workspace root stays free of the optional admin
# daemon and its axum/SQLite dependencies; build it explicitly with
# `cargo build -p rustvpn-admin --bins`.
default-members = [
    "crates/rustvpn-crypto",
    "crates/rustvpn-proto",
    "crates/rustvpn-verifier",
    "crates/rustvpn-net",
    "crates/rustvpn-server",
    "crates/rustvpn-client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
authors = ["GoVPN contributors"]

[workspace.dependencies]
salsa20 = { version = "0.10", features = ["zeroize"] }
poly1305 = "0.8"
blake2 = "0.10"
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "zeroize"] }
base64 = "0.22"
subtle = "2.6"
zeroize = "1.8"
getrandom = "0.2"
rpassword = "7"
rand_core = { version = "0.6", features = ["getrandom"] }
curve25519-dalek = { version = "4.1", default-features = false, features = ["alloc", "precomputed-tables"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "process", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
tun = { version = "0.7.13", features = ["async"] }
serde_yaml_ng = "0.10"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
libc = "0.2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
